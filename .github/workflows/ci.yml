name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo test --no-default-features

  solver-comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path solver-comparison/Cargo.toml -- --check
      - run: cargo clippy --manifest-path solver-comparison/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path solver-comparison/Cargo.toml --locked
      - run: cargo run --manifest-path solver-comparison/Cargo.toml --locked
  benchmark-reproducibility:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check benchmark revision guards and lock restoration
        shell: pwsh
        run: ./benchmarks/senior-grand-prix/test-runner.ps1
