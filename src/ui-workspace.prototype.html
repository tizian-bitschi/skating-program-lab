const profileLabel=k=>({bronze:['Adult · Bronze','Adult · Bronze','Взрослые · Бронза'],silver:['Adult · Silber','Adult · Silver','Взрослые · Серебро'],gold:['Adult · Gold','Adult · Gold','Взрослые · Золото'],masters:['Adult · Masters','Adult · Masters','Взрослые · Мастерс'],women:['Senior · Frauen','Senior · Women','Сеньоры · Женщины'],men:['Senior · Männer','Senior · Men','Сеньоры · Мужчины']}[k][['de','en','ru'].indexOf(lang)]);
const catalogue=[];
for(const [kind,...names] of kinds)for(const r of [1,2,3])catalogue.push({code:r+kind,family:'jump',kind,r,names:names.map((name,i)=>[i===0?['Einfacher','Doppelter','Dreifacher'][r-1]:i===1?['Single','Double','Triple'][r-1]:['Одинарный','Двойной','Тройной'][r-1],name].join(' ')),parts:[{kind,r}]});
for(const [kind,...names]of spinKinds)for(const level of [0,1,2,3,4])for(const reduced of kind.endsWith('CoSp')?[false,true]:[false])catalogue.push({code:kind+(level||'B')+(reduced?'V':''),family:'spin',kind,level,names:names.map(n=>n+(reduced?' · V':''))});
catalogue.push({code:'1Lz+1T',family:'jump',names:['Lutz + Toeloop','Lutz + toe loop','Лутц + тулуп'],parts:[{kind:'Lz',r:1},{kind:'T',r:1}]},{code:'1T+1Lo',family:'jump',names:['Toeloop + Rittberger','Toe loop + loop','Тулуп + риттбергер'],parts:[{kind:'T',r:1},{kind:'Lo',r:1}]},{code:'1A+1A+SEQ',family:'jump',names:['Axel + Axel, Sequenz','Axel + Axel sequence','Аксель + аксель, комбинация'],parts:[{kind:'A',r:1},{kind:'A',r:1}]});
for(const level of [0,1,2,3,4])catalogue.push({code:'StSq'+(level||'B'),family:'other',kind:'StSq',level,names:['Schrittfolge','Step sequence','Дорожка шагов']});
catalogue.push({code:'ChSq1',family:'other',kind:'ChSq',names:['Choreografische Sequenz','Choreographic sequence','Хореографическая последовательность']},{code:'ChSp1',family:'other',kind:'ChSp',names:['Choreografische Pirouette','Choreographic spin','Хореографическое вращение']});

// Illustrative whole-element choices, not a second rule engine or full repertoire.
const connectionSamples=['1T+1T','1T+1Lo','1S+1T','1S+1Lo','1Lo+1T','1Lo+1Lo','1F+1T','1F+1Lo','1Lz+1T','1Lz+1Lo','1A+1T','1A+1Lo','1Lz+1T+1Lo','1F+1T+1Lo','1A+1T+1Lo','1T+1Lo+1Lo','1Lz+1Eu+1S','1F+1Eu+1S','1A+1Eu+1F','2Lz+2T','2F+2T','2S+2Lo','1T+1A+SEQ','1S+1A+SEQ','1Lo+1A+SEQ','1F+1A+SEQ','1Lz+1A+SEQ','1A+1A+SEQ','1Lz+1T+1A+SEQ','1A+1A+1T+SEQ'];
for(const code of connectionSamples){if(catalogue.some(e=>e.code===code))continue;const tokens=code.replace(/\+SEQ$/,'').split('+');const atoms=tokens.map(token=>catalogue.find(e=>e.code===token));catalogue.push({code,family:'jump',names:['de','en','ru'].map((_,i)=>tokens.map((token,j)=>token==='1Eu'?['Euler','Euler','Ойлер'][i]:atoms[j].names[i]).join(' + ')),parts:tokens.filter(token=>token!=='1Eu').map(token=>{const match=token.match(/^(\d)(.*)$/);return {r:Number(match[1]),kind:match[2]}})})}

const get=code=>catalogue.find(e=>e.code===code);
const name=e=>e.names[['de','en','ru'].indexOf(lang)]+(e.level!==undefined?' · '+(e.level?t('level')+' '+e.level:t('basic')):'');
const defaultLimits=()=>({jumps:Object.fromEntries(kinds.map(([k])=>[k,{allowed:true,max:0}])),spins:Object.fromEntries(spinKinds.map(([k])=>[k,{allowed:true,max:-1}])),steps:{allowed:true,max:-1},choreo:true,chspin:true,exact:[],mixed:false});
let serial=3;
let model={profile:'silver',plan:[{id:1,code:'1A',keep:true},{id:2,code:'CSSp2',keep:true}],limits:defaultLimits(),revision:0};
let ui={dialog:null,query:'',catalogFamily:'all',onlyAllowed:true,notice:'',compared:[],connectionMode:'combo',connectionParts:[]};
let results={state:'idle',revision:0,items:[],seed:[],cycles:0},history=[],timer;
const app=document.getElementById('app');
const clone=v=>JSON.parse(JSON.stringify(v));
function mutate(fn){history.push(clone(model));if(history.length>25)history.shift();fn();model.revision++;ui.notice='';render()}
function categoryIssue(e){const p=profiles[model.profile];if(e.family==='jump'){if(e.parts.some(part=>part.r>p.jump||part.kind==='A'&&!p.axel))return true;if(model.profile==='gold'&&e.parts.some(part=>part.r===2&&!['T','S','Lo'].includes(part.kind)))return true;if(model.profile==='bronze'&&(e.code.includes('SEQ')||e.code.includes('Eu')||e.parts.length>2))return true}if(e.family==='spin'&&(e.level>p.spin||!spinAvailability[model.profile].includes(e.kind)))return true;if(e.kind==='StSq'&&(p.step===null||e.level>p.step))return true;if(e.kind==='ChSq'&&!p.choreo)return true;if(e.kind==='ChSp'&&model.profile==='bronze')return true;return false}
function restrictionIssue(e,ignoreExact=false){const l=model.limits;if(!ignoreExact&&l.exact.includes(e.code))return 'excluded';if(e.family==='jump')for(const part of e.parts){const v=l.jumps[part.kind];if(!v.allowed)return 'excluded';if(v.max&&part.r>v.max)return 'overLimit'}if(e.family==='spin'){const v=l.spins[e.kind];if(!v.allowed)return 'excluded';if(v.max>=0&&e.level>v.max)return 'overLimit'}if(e.kind==='StSq'){if(!l.steps.allowed)return 'excluded';if(l.steps.max>=0&&e.level>l.steps.max)return 'overLimit'}if(e.kind==='ChSq'&&!l.choreo||e.kind==='ChSp'&&!l.chspin)return 'excluded';return null}
const conflicts=()=>model.plan.filter(p=>p.keep&&(restrictionIssue(get(p.code))||categoryIssue(get(p.code))));
function opt(value,label,current){return `<option value="${value}"${String(value)===String(current)?' selected':''}>${esc(label)}</option>`}
function assessment(){const c=conflicts();return `<div class="assessment ${c.length?'bad':''}">${icon(c.length?'warning':'info')}<div><strong>${t(c.length?'conflicts':'previewCheck')}${c.length?' ('+c.length+')':''}</strong><p>${t(c.length?'conflictHelp':'previewCheckHelp')}</p></div></div>`}
function plan(){return `<section class="surface " aria-labelledby="plan-title"><div class="panel-pad"><div class="sectionhead"><div><h2 id="plan-title">${t('plan')}</h2><p class="small muted">${t('planHelp')}</p></div><button class="quiet" data-action="undo" ${!history.length?'disabled':''} aria-label="${t('undo')}">${icon('undo')}</button></div>${model.plan.length?`<ol class="element-list">${model.plan.map((p,i)=>{const e=get(p.code),issue=p.keep&&(restrictionIssue(e)||(categoryIssue(e)?'notCategory':null));return `<li class="element-row ${issue?'conflict':''}"><span class="element-number">${String(i+1).padStart(2,'0')}</span><div class="grow"><div class="element-title">${esc(name(e))}</div><span class="code">${e.code}</span>${issue?`<p class="element-conflict">${t(issue)}</p>`:''}</div><div class="element-controls"><button class="keep" data-action="keep" data-id="${p.id}" aria-pressed="${p.keep}" aria-label="${esc((p.keep?t('keep'):t('free'))+' '+name(e))}">${icon(p.keep?'lock':'unlock')}<span>${t(p.keep?'keep':'free')}</span></button><button class="icon quiet move" data-action="move" data-id="${p.id}" data-direction="-1" aria-label="${t('up')} ${e.code}" ${i===0?'disabled':''}>${icon('up')}</button><button class="icon quiet move" data-action="move" data-id="${p.id}" data-direction="1" aria-label="${t('down')} ${e.code}" ${i===model.plan.length-1?'disabled':''}>${icon('down')}</button><button class="icon quiet" data-action="remove" data-id="${p.id}" aria-label="${t('remove')} ${e.code}">${icon('close')}</button></div></li>`}).join('')}</ol>`:`<div class="empty">${icon('skate')}<h3>${t('empty')}</h3><p>${t('emptyHelp')}</p></div>`}<button class="add-row" data-action="catalog">${icon('add')}${t('add')}</button></div>${assessment()}</section><div class="main-actions"><p>${t('searchHint')}</p><button class="primary" data-action="search" ${conflicts().length||results.state==='proving'?'disabled':''}>${icon('search')}${t(conflicts().length?'fixFirst':model.plan.some(p=>p.keep)?'complete':'search')}</button></div>`}
function resultPanel(){const stale=results.revision!==model.revision&&results.state!=='idle';const labels={proving:'proving',collecting:'collecting',paused:'paused',exhausted:'exhausted',cancelled:'cancelled'};return `<section class="surface results" aria-labelledby="results-title"><div class="panel-pad"><div class="results-header"><h2 id="results-title" tabindex="-1">${t('results')}</h2><span class="tag">${t('example')}</span></div>${results.state==='idle'?`<p class="result-empty">${t('noResults')}</p><p class="result-help">${t('noResultsHelp')}</p>`:`<div class="stack" style="gap:4px;margin-top:16px"><div class="state-line">${icon(results.state==='proving'?'search':results.state==='exhausted'?'check':results.state==='paused'?'pause':'info')}<strong class="result-state">${t(labels[results.state])}</strong></div><p class="result-info">${results.state==='proving'?t('provingHelp'):t('found')+': '+results.items.length+(results.state==='exhausted'?'':' · '+t('unknownTotal'))}</p></div>${stale?`<p class="outdated" role="status">${t('outdated')}</p>`:''}<ul class="result-list">${results.items.map((item,i)=>`<li class="result-item"><div class="row between"><h3>${t('variant')} ${i+1}</h3><button class="quiet small" data-action="compare" data-key="${i}" aria-pressed="${ui.compared.includes(i)}">${t(ui.compared.includes(i)?'marked':'compare')}</button></div><p class="code" style="margin-top:8px">${item.join(' · ')}</p><div class="row between" style="margin-top:12px"><span class="small muted">${t('replaceableSlot')}</span><button data-action="apply" data-key="${i}" ${stale?'disabled':''}>${t('apply')}</button></div></li>`).join('')}</ul>${ui.compared.length===2?`<div class="filter-note"><h3>${t('compareTitle')}</h3><p class="small" style="margin-top:4px">${t('compareHelp')}</p>${ui.compared.map(i=>`<p class="code" style="margin-top:8px">${t('variant')} ${i+1}: ${results.items[i].join(' · ')}</p>`).join('')}</div>`:''}<div class="result-actions">${results.state==='proving'?`<button data-action="cancel">${t('cancel')}</button>`:''}${results.state==='collecting'||results.state==='paused'?`<button data-action="${results.state==='paused'?'resume':'more'}" ${stale?'disabled':''}>${t(results.state==='paused'?'resume':'more')}</button>${results.state==='collecting'?`<button data-action="pause">${t('pause')}</button>`:''}<button data-action="cancel">${t('cancel')}</button>`:''}</div><p class="result-help">${t('sampleWarning')}</p>`}</div></section>`}

function mixerLabel(type,key,value){if(!value)return t('off');if(type==='jump')return value+key;if(type==='spin')return key+(value===1?'B':value-1);return value===1?t('basic'):t('level')+' '+(value-1)}
function mixerReadout(type,key,value){return type==='spin'&&value>0?(value===1?'B':String(value-1)):mixerLabel(type,key,value)}
function mixerDetail(type,value){return !value?'':type==='jump'?t(['single','double','triple','quad','quint'][value-1]):type==='spin'?(value===1?t('basic'):t('level')+' '+(value-1)):''}
function mixerChannel(type,key,label,limit,cap,compact=false){const unavailable=cap===null;const max=unavailable?1:type==='jump'?cap:cap+1;const value=unavailable||!limit.allowed?0:type==='jump'?(limit.max?Math.min(limit.max,max):max):(limit.max<0?max:Math.min(limit.max+1,max));const ticks=Array.from({length:max+1},(_,i)=>max-i);const id='fader-'+type+'-'+key;return `<div class="mixer-channel ${!value?'is-off':''} ${unavailable?'is-unavailable':''}"><label class="mixer-name" for="${id}" title="${esc(label)}">${esc(compact&&type!=='jump'?key:label)}</label><output class="mixer-readout" for="${id}">${unavailable?'—':mixerReadout(type,key,value)}</output><div class="mixer-kind">${mixerDetail(type,value)}</div><div class="mixer-lane"><div class="mixer-scale" aria-hidden="true">${ticks.map(i=>`<span>${!i?t('off'):type==='jump'?i:i===1?'B':i-1}</span>`).join('')}</div><span class="mixer-control"><span class="mixer-rail" aria-hidden="true"></span><input id="${id}" type="range" min="0" max="${max}" step="1" value="${value}" data-action="fader" data-type="${type}" data-key="${key}" data-label="${esc(label)}" aria-label="${esc(label)}" aria-valuetext="${esc(unavailable?t('notAllowed'):mixerLabel(type,key,value)+' '+mixerDetail(type,value))}" ${unavailable?'disabled':''}></span></div><span class="mixer-cap">${unavailable?t('notAllowed'):''}</span></div>`}
function MixerWorkspace(){const p=profiles[model.profile],l=model.limits;const jumps=kinds.map(([k,...names])=>mixerChannel('jump',k,names[['de','en','ru'].indexOf(lang)],l.jumps[k],!p.axel&&k==='A'?null:model.profile==='gold'&&!['T','S','Lo'].includes(k)?1:p.jump,true)).join('');const spins=spinKinds.map(([k,...names])=>mixerChannel('spin',k,names[['de','en','ru'].indexOf(lang)],l.spins[k],spinAvailability[model.profile].includes(k)?p.spin:null,true)).join('');const step=mixerChannel('step','StSq',get('StSq1').names[['de','en','ru'].indexOf(lang)],l.steps,p.step,true);return `<div class="console-workspace"><section class="surface console-limits"><div class="console-head"><h2>${t('mixer')}</h2><output id="mixer-inspector" class="console-inspector"></output><button data-action="reset">${lang==='de'?'Zurücksetzen':lang==='en'?'Reset':'Сбросить'}</button><button data-action="mixer-extra">${t('connections')}${model.limits.exact.length?' ('+model.limits.exact.length+')':''}</button></div><div class="console-banks"><section class="console-bank"><h3>${t('jumps')}</h3><div class="mixer-board">${jumps}</div></section><section class="console-bank"><h3>${t('spins')}</h3><div class="mixer-board spin-board">${spins}</div></section><section class="console-bank"><h3>${t('other')}</h3><div class="console-other"><div class="mixer-board">${step}</div><div class="console-toggles">${[['choreo','ChSq1'],['chspin','ChSp1']].map(([key,code])=>`<label><input type="checkbox" data-action="boolean" data-key="${key}" ${l[key]?'checked':''}>${esc(name(get(code)))}</label>`).join('')}</div></div></section></div></section><div class="console-lower"><div class="console-program">${plan()}</div>${resultPanel().replace('surface results','surface results console-results')}</div></div>`}
function setFader(el){const type=el.dataset.type,key=el.dataset.key,value=Number(el.value);const limit=type==='jump'?model.limits.jumps[key]:type==='spin'?model.limits.spins[key]:model.limits.steps;limit.allowed=value>0;if(value)limit.max=type==='jump'?value:value-1}
function previewFader(el){const channel=el.closest('.mixer-channel'),value=Number(el.value),type=el.dataset.type,key=el.dataset.key;channel.querySelector('output').textContent=mixerReadout(type,key,value);const inspector=document.getElementById('mixer-inspector');if(inspector)inspector.textContent=el.dataset.label+' · '+mixerLabel(type,key,value);channel.querySelector('.mixer-kind').textContent=mixerDetail(type,value);channel.classList.toggle('is-off',!value);el.setAttribute('aria-valuetext',mixerLabel(type,key,value)+' '+mixerDetail(type,value))}


function connectionTokens(code){return code.replace(/\+SEQ$/,'').split('+')}
function connectionCandidates(){return catalogue.filter(e=>e.family==='jump'&&e.code.includes('+')&&e.code.endsWith('+SEQ')===(ui.connectionMode==='sequence')&&!categoryIssue(e)&&!restrictionIssue(e,true))}
function connectionSelectedCode(){return ui.connectionParts.join('+')+(ui.connectionMode==='sequence'?'+SEQ':'')}
function connectionPartName(token){return token==='1Eu'?t('euler'):name(get(token))}
function connectionName(code){return connectionTokens(code).map(connectionPartName).join(code.endsWith('+SEQ')?' → ':' + ')}
function connectionDialog(){const parts=ui.connectionParts,pool=connectionCandidates(),prefix=pool.filter(e=>parts.every((part,i)=>connectionTokens(e.code)[i]===part));const next=[...new Set(prefix.map(e=>connectionTokens(e.code)[parts.length]).filter(Boolean))];const selected=connectionSelectedCode(),exact=parts.length>=2&&pool.some(e=>e.code===selected),blocked=model.limits.exact.includes(selected);const excluded=model.limits.exact.filter(code=>code.includes('+')),legacy=model.limits.exact.filter(code=>!code.includes('+'));return `<div class="dialoghead"><h2 id="dialog-title">${t('connections')}</h2><span class="tag">${t('sampleConnections')}</span><button class="icon quiet" data-action="close" aria-label="${t('close')}">${icon('close')}</button></div><div class="connection-modes" role="group" aria-label="${t('connections')}"><button data-action="connection-mode" data-key="combo" aria-pressed="${ui.connectionMode==='combo'}">${t('combination')}</button><button data-action="connection-mode" data-key="sequence" aria-pressed="${ui.connectionMode==='sequence'}">${t('sequence')}</button></div><div class="connection-stage" aria-label="${t(ui.connectionMode==='sequence'?'sequence':'combination')}">${parts.map((token,i)=>`${i?`<span class="connection-join" aria-hidden="true">${ui.connectionMode==='sequence'?'→':'+'}</span>`:''}<button class="connection-part" data-action="connection-truncate" data-key="${i}" aria-label="${esc(t('changeJump')+' '+(i+1)+': '+connectionPartName(token))}"><strong>${esc(connectionPartName(token))}</strong><span class="code">${token}</span></button>`).join('')}${next.length?`${parts.length?'<span class="connection-join" aria-hidden="true">+</span>':''}<div class="connection-part placeholder"><span>${parts.length+1}.</span><strong>${t(exact?'optionalJump':'jumpSlot')}</strong></div>`:''}</div>${next.length?`<div class="connection-next${exact?' is-optional':''}"><h3>${t(exact?'optionalJump':parts.length?'nextJump':'firstJump')}</h3></div><div class="connection-choices">${next.map(token=>`<button class="connection-choice" data-action="connection-pick" data-key="${token}"><strong>${esc(connectionPartName(token))}</strong><span class="code">${token}</span></button>`).join('')}</div>`:!exact?`<p class="connection-warning" role="status">${t('noConnections')}</p>`:''}<div class="connection-actions"><button class="primary" data-action="connection-toggle" ${!exact?'disabled':''}>${t(blocked?'allowConnection':'excludeConnection')}</button><button data-action="connection-new">${t('newConnection')}</button></div>${excluded.length?`<section class="connection-blocked"><h3>${t('excludedConnections')}</h3>${excluded.map(code=>`<div class="connection-blocked-row"><div><div class="connection-blocked-name">${esc(connectionName(code))} <span class="tag">${t(code.endsWith('+SEQ')?'sequence':'combination')}</span></div><span class="code">${code}</span></div><button data-action="unexclude" data-key="${code}" aria-label="${esc(t('allowConnection')+': '+connectionName(code))}">${t('allowShort')}</button></div>`).join('')}</section>`:''}${legacy.length?`<details class="connection-options"><summary>${t('legacyExclusions')}</summary>${legacy.map(code=>`<div class="connection-blocked-row"><span class="code">${esc(code)}</span><button data-action="unexclude" data-key="${esc(code)}">${t('allowShort')}</button></div>`).join('')}</details>`:''}<details class="connection-options"><summary>${t('connectionOptions')}</summary><label class="small-check"><input type="checkbox" data-action="boolean" data-key="mixed" ${model.limits.mixed?'checked':''}>${t('mixed')}</label></details>`}

function catalogDialog(){const list=catalogue.filter(e=>(ui.catalogFamily==='all'||e.family===ui.catalogFamily)&&(!ui.onlyAllowed||!restrictionIssue(e)&&!categoryIssue(e))&&(!ui.query||(e.code+' '+e.names.join(' ')).toLocaleLowerCase().includes(ui.query.toLocaleLowerCase())));return `<div class="dialoghead"><h2 id="dialog-title">${t('catalog')}</h2><button class="icon quiet" data-action="close" aria-label="${t('close')}">${icon('close')}</button></div><p class="catalog-help">${t('sampleCatalog')}</p><label class="dialog-search" for="catalog-search"><span class="small">${t('catalogSearch')}</span><input type="search" id="catalog-search" value="${esc(ui.query)}" data-action="query" autocomplete="off" placeholder="Axel, 1A, CCoSp …"></label><div class="catalog-family" role="group" aria-label="${t('catalog')}">${[['all','all'],...Object.entries(families)].map(([key,label])=>`<button data-action="catalog-family" data-key="${key}" aria-pressed="${key===ui.catalogFamily}">${t(label)}</button>`).join('')}</div><label class="small-check"><input type="checkbox" data-action="only-allowed" ${ui.onlyAllowed?'checked':''}>${t('onlyAllowed')}</label><p class="catalog-help" style="margin-top:12px" role="status">${t('matches')}: ${list.length}</p><div class="catalog-list">${list.length?list.map(e=>`<div class="catalog-row"><div class="grow"><div class="element-title">${esc(name(e))}</div><span class="code">${e.code}</span>${restrictionIssue(e)||categoryIssue(e)?` <span class="tag">${t('blocked')}</span>`:''}</div><button class="icon" data-action="add" data-key="${e.code}" aria-label="${esc(t('add')+' '+name(e))}">${icon('add')}</button></div>`).join(''):`<p class="result-help">${t('noMatches')}</p>`}</div><p class="status-announcement" aria-live="polite">${ui.notice}</p><button data-action="close" style="width:100%;margin-top:12px">${t('done')}</button>`}
function navbar(){return `<header class="topline unified-navbar"><div class="brand">${icon('skate')}Skating Program Lab</div><div class="profile"><label for="profile">${t('category')}</label><select id="profile" data-action="profile">${Object.entries(profiles).map(([k,v])=>opt(k,profileLabel(k),model.profile)).join('')}</select></div><label class="locale"><span class="small">${t('language')}</span><select data-action="language" aria-label="${t('language')}">${[['de','Deutsch'],['en','English'],['ru','Русский']].map(([k,v])=>opt(k,v,lang)).join('')}</select></label></header>`}
function render(){const active=document.activeElement;const focusId=active?.id;const focusAction=active?.dataset?.action;const focusKey=active?.dataset?.key;const focusType=active?.dataset?.type;const focusItem=active?.dataset?.id;const dialogScroll=app.querySelector('dialog')?.scrollTop||0;const listScroll=app.querySelector('.catalog-list')?.scrollTop||0;const start=active?.selectionStart,end=active?.selectionEnd;const modalWasOpen=!!document.querySelector('dialog[open]');document.documentElement.lang=lang;document.title='C2 Mixer · Prototype';app.innerHTML=`${navbar()}<main class="shell variant-C2">${MixerWorkspace()}<div class="status-announcement" aria-live="polite">${ui.notice}</div></main><dialog ${ui.dialog==='connections'?'class="connection-dialog"':''} aria-labelledby="dialog-title"><div class="dialog-content">${ui.dialog==='connections'?connectionDialog():ui.dialog==='catalog'?catalogDialog():''}</div></dialog>`;const dialog=app.querySelector('dialog');if(ui.dialog){dialog.showModal();dialog.addEventListener('cancel',event=>{event.preventDefault();ui.dialog=null;ui.notice='';render()});dialog.scrollTop=dialogScroll;const list=dialog.querySelector('.catalog-list');if(list)list.scrollTop=listScroll;if(focusId&&dialog.querySelector('#'+CSS.escape(focusId))){const el=document.getElementById(focusId);el.focus({preventScroll:true});if(typeof start==='number'&&el.setSelectionRange)el.setSelectionRange(start,end)}else if(!modalWasOpen&&ui.dialog==='catalog')document.getElementById('catalog-search').focus()}else if(focusId&&document.getElementById(focusId)){const el=document.getElementById(focusId);el.focus({preventScroll:true});if(typeof start==='number'&&el.setSelectionRange)el.setSelectionRange(start,end)}if(focusAction&&!focusId){const scope=ui.dialog?dialog:app;const candidates=[...scope.querySelectorAll('[data-action]')];let target=candidates.find(e=>e.dataset.action===focusAction&&e.dataset.key===focusKey&&e.dataset.type===focusType&&e.dataset.id===focusItem&&!e.disabled&&e.getClientRects().length);const fallback={pause:"resume",resume:"pause",search:"cancel",cancel:"search",remove:"catalog",apply:"search"}[focusAction];if(!target&&fallback)target=candidates.find(e=>e.dataset.action===fallback&&!e.disabled&&e.getClientRects().length);if(!target&&focusAction==="more")target=document.getElementById("results-title");if(target)target.focus({preventScroll:true})}if(!ui.dialog&&modalWasOpen){const target=app.querySelector('[data-action="'+(ui.returnFocus||'catalog')+'"]');if(target)target.focus({preventScroll:true})}if(ui.dialog==='connections'&&ui.connectionFocus){const action=ui.connectionFocus==='commit'?'connection-toggle':'connection-pick';const target=dialog.querySelector('[data-action="'+action+'"]');if(target&&!target.disabled)target.focus({preventScroll:true});ui.connectionFocus=null}}
function historyUrl(url){window.history.replaceState(null,'',url)}
function beginExample(){clearTimeout(timer);results={state:'proving',revision:model.revision,items:[],seed:model.plan.filter(p=>p.keep).map(p=>p.code),cycles:0};ui.compared=[];render();timer=setTimeout(()=>{if(results.state==='proving'){results.state='collecting';addExampleBatch()}},900)}
function addExampleBatch(){if(results.revision!==model.revision)return;const batches=[['1Lz','SSp1'],['1T+1Lo','CLSp2'],['1T','ChSq1'],['1Lz+1T','CSSp1']];if(results.cycles>=2){results.state='exhausted';render();return}const start=results.cycles*2;for(let i=start;i<start+2;i++){const additions=batches[i].filter(code=>!restrictionIssue(get(code))&&!categoryIssue(get(code)));results.items.push([...results.seed,...additions])}results.cycles++;render()}
app.addEventListener('click',event=>{const el=event.target.closest('button[data-action]');if(!el||el.disabled)return;const a=el.dataset.action,k=el.dataset.key,id=Number(el.dataset.id);if(a==='connection-mode'){ui.connectionMode=k;ui.connectionParts=[];ui.connectionFocus='choices';return render()}if(a==='connection-pick'){ui.connectionParts.push(k);ui.connectionFocus=connectionCandidates().some(e=>e.code===connectionSelectedCode())?'commit':'choices';return render()}if(a==='connection-truncate'){ui.connectionParts=ui.connectionParts.slice(0,Number(k));ui.connectionFocus='choices';return render()}if(a==='connection-new'){ui.connectionParts=[];ui.connectionFocus='choices';return render()}if(a==='connection-toggle'){const code=connectionSelectedCode();if(ui.connectionParts.length<2||!connectionCandidates().some(e=>e.code===code))return;return mutate(()=>{model.limits.exact=model.limits.exact.includes(code)?model.limits.exact.filter(c=>c!==code):[...model.limits.exact,code]})}if(a==='mixer-extra'){ui.returnFocus='mixer-extra';ui.dialog='connections';return render()}if(a==='catalog'){ui.returnFocus='catalog';ui.dialog='catalog';ui.query='';ui.notice='';return render()}if(a==='close'){ui.dialog=null;ui.notice='';render();return}if(a==='catalog-family'){ui.catalogFamily=k;return render()}if(a==='add'){mutate(()=>model.plan.push({id:serial++,code:k,keep:true}));ui.notice=t('added');return render()}if(a==='keep')return mutate(()=>{const p=model.plan.find(p=>p.id===id);p.keep=!p.keep});if(a==='remove')return mutate(()=>model.plan=model.plan.filter(p=>p.id!==id));if(a==='move')return mutate(()=>{const i=model.plan.findIndex(p=>p.id===id),j=i+Number(el.dataset.direction);[model.plan[i],model.plan[j]]=[model.plan[j],model.plan[i]]});if(a==='undo'&&history.length){const rev=model.revision+1;model=history.pop();model.revision=rev;return render()}if(a==='reset')return mutate(()=>model.limits=defaultLimits());if(a==='unexclude')return mutate(()=>model.limits.exact=model.limits.exact.filter(c=>c!==k));if(a==='search')return beginExample();if(a==='pause'){results.state='paused';return render()}if(a==='resume'){results.state='collecting';return render()}if(a==='more')return addExampleBatch();if(a==='cancel'){clearTimeout(timer);results.state='cancelled';return render()}if(a==='compare'){const i=Number(k);ui.compared=ui.compared.includes(i)?ui.compared.filter(n=>n!==i):[...ui.compared.slice(-1),i];return render()}if(a==='apply'){const kept=model.plan.filter(p=>p.keep);const remaining=results.items[Number(k)].slice(results.seed.length);mutate(()=>model.plan=[...kept,...remaining.map(code=>({id:serial++,code,keep:false}))]);ui.notice=t('applied');return render()}});
app.addEventListener('change',event=>{const el=event.target,a=el.dataset.action,k=el.dataset.key;if(a==='language'){lang=el.value;ui.notice='';const url=new URL(location.href);url.searchParams.set('lang',lang);historyUrl(url);return render()}if(a==='fader')return mutate(()=>setFader(el));if(a==='profile')return mutate(()=>model.profile=el.value);if(a==='only-allowed'){ui.onlyAllowed=el.checked;return render()}if(a==='boolean')return mutate(()=>model.limits[k]=el.checked)});
app.addEventListener('focusin',event=>{if(event.target.dataset.action==='fader')previewFader(event.target)});
app.addEventListener('input',event=>{const el=event.target;if(el.dataset.action==='fader')return previewFader(el);if(el.dataset.action==='query'){ui.query=el.value;render()}});
render();
</script>
</html>
